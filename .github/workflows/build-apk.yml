name: Crea APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installa dipendenze
        run: npm install
      - name: Crea progetto Android
        run: npx cap add android
      - name: Impostazioni Android (schermo intero, orizzontale, icona)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#</style>#<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style>#' $S
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/ic_$d.png $R/mipmap-$d/ic_launcher.png
            cp assets/ic_$d.png $R/mipmap-$d/ic_launcher_round.png
            cp assets/ic_$d.png $R/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Sincronizza il gioco
        run: npx cap sync android
      - name: Compila APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BunnyTheGame-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
